name: Career Navigator - E2E, Load and Security
on:
  push:
    branches: [main, develop]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
  security-events: write
concurrency:
  group: career-navigator-ci-${{ github.event.pull_request.head.ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  selenium:
    name: Selenium Web E2E
    runs-on: ubuntu-latest
    services:
      mongodb:
        image: mongo:7
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --eval 'db.adminCommand({ ping: 1 })'"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            backend/package-lock.json
            web/frontend/package-lock.json
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Python report dependency
        run: python -m pip install openpyxl
      - name: Install backend dependencies
        working-directory: backend
        run: npm ci
      - name: Start isolated test backend
        working-directory: backend
        env:
          PORT: 5000
          NODE_ENV: test
          MONGO_URI: mongodb://127.0.0.1:27017/career_navigator_selenium
          JWT_SECRET: ci-only-not-a-production-secret
        run: |
          node server.js > /tmp/backend.log 2>&1 &
          for i in {1..60}; do
            if curl -fsS http://127.0.0.1:5000/health | grep -q '"database":"connected"'; then exit 0; fi
            sleep 2
          done
          cat /tmp/backend.log
          exit 1
      - name: Create disposable E2E account
        run: |
          EMAIL="e2e-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}@example.test"
          PASSWORD="CI-Test-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-A9!"
          curl --fail-with-body -sS -X POST http://127.0.0.1:5000/auth/signup \
            -H "Content-Type: application/json" \
            -d "{\"name\":\"Career Navigator CI\",\"email\":\"$EMAIL\",\"password\":\"$PASSWORD\"}"
          echo "E2E_EMAIL=$EMAIL" >> "$GITHUB_ENV"
          echo "E2E_PASSWORD=$PASSWORD" >> "$GITHUB_ENV"
      - name: Install web dependencies
        working-directory: web/frontend
        run: npm ci
      - name: Start web frontend
        working-directory: web/frontend
        env:
          VITE_API_BASE_URL: http://127.0.0.1:5000
        run: npm run dev -- --host 0.0.0.0 > /tmp/web.log 2>&1 &
      - name: Wait for frontend
        run: |
          for i in {1..45}; do
            if curl -fsS http://127.0.0.1:5173/login >/dev/null; then exit 0; fi
            sleep 2
          done
          cat /tmp/web.log
          exit 1
      - name: Install Selenium test dependencies
        working-directory: selenium-tests
        run: npm install
      - name: Run Selenium tests
        working-directory: selenium-tests
        env:
          WEB_BASE_URL: http://127.0.0.1:5173
          E2E_EMAIL: ${{ env.E2E_EMAIL }}
          E2E_PASSWORD: ${{ env.E2E_PASSWORD }}
          LOGIN_SUCCESS_SELECTOR: "form#profile-form"
        run: |
          mkdir -p ../selenium-results
          set +e
          npx mocha tests/login-tests.js --reporter json > ../selenium-results/mocha.json
          TEST_EXIT_CODE=$?
          set -e
          echo "$TEST_EXIT_CODE" > ../selenium-results/exit-code
          exit "$TEST_EXIT_CODE"
      - name: Generate Selenium Excel test plan
        if: always()
        run: python scripts/generate-test-plans.py
      - name: Generate Selenium execution report
        if: always()
        run: |
          python scripts/generate-execution-report.py \
            --suite "Selenium Web E2E" \
            --results selenium-results/mocha.json \
            --exit-code-file selenium-results/exit-code \
            --output-dir selenium-results/report
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: selenium-execution-report
          path: |
            selenium-results/
            selenium-tests/selenium-test-cases.xlsx

  appium:
    name: Appium Android E2E
    runs-on: ubuntu-latest
    services:
      mongodb:
        image: mongo:7
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --eval 'db.adminCommand({ ping: 1 })'"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17
      - name: Install Python report dependency
        run: python -m pip install openpyxl
      - name: Install backend dependencies
        working-directory: backend
        run: npm ci
      - name: Start isolated test backend
        working-directory: backend
        env:
          PORT: 5000
          NODE_ENV: test
          MONGO_URI: mongodb://127.0.0.1:27017/career_navigator_appium
          JWT_SECRET: ci-only-not-a-production-secret
        run: |
          node server.js > /tmp/backend.log 2>&1 &
          for i in {1..60}; do
            if curl -fsS http://127.0.0.1:5000/health | grep -q '"database":"connected"'; then exit 0; fi
            sleep 2
          done
          cat /tmp/backend.log
          exit 1
      - name: Create disposable E2E account
        run: |
          EMAIL="mobile-e2e-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}@example.test"
          PASSWORD="CI-Mobile-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-B8!"
          curl --fail-with-body -sS -X POST http://127.0.0.1:5000/auth/signup \
            -H "Content-Type: application/json" \
            -d "{\"name\":\"Career Navigator Mobile CI\",\"email\":\"$EMAIL\",\"password\":\"$PASSWORD\"}"
          echo "E2E_EMAIL=$EMAIL" >> "$GITHUB_ENV"
          echo "E2E_PASSWORD=$PASSWORD" >> "$GITHUB_ENV"
      - name: Install Appium and test dependencies
        run: |
          npm install -g appium
          appium driver install uiautomator2
          cd appium-tests && npm install
      - name: Build Android Release APK
        working-directory: mobile/frontend
        env:
          EXPO_PUBLIC_API_URL: http://127.0.0.1:5000
        run: |
          npm install
          npx expo prebuild --platform android --non-interactive
          sed -i 's/<application /<application android:usesCleartextTraffic="true" /' android/app/src/main/AndroidManifest.xml
          chmod +x android/gradlew
          cd android
          ./gradlew assembleRelease --no-daemon -x lint -x lintVitalRelease
      - name: Enable KVM group permissions
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Run Appium tests on Android emulator
        uses: reactivecircus/android-emulator-runner@v2
        env:
          E2E_EMAIL: ${{ env.E2E_EMAIL }}
          E2E_PASSWORD: ${{ env.E2E_PASSWORD }}
        with:
          api-level: 34
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          force-avd-creation: false
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim -camera-back none
          script: bash scripts/run-appium-ci.sh
      - name: Generate Appium execution report
        if: always()
        run: |
          python scripts/generate-execution-report.py \
            --suite "Appium Android E2E" \
            --results appium-results/mocha.json \
            --exit-code-file appium-results/exit-code \
            --output-dir appium-results/report
      - name: Generate Appium Excel test plan
        if: always()
        run: python scripts/generate-test-plans.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: appium-execution-report
          path: |
            appium-results/
            appium-tests/appium-test-cases.xlsx

  load-test:
    name: k6 Baseline - 100 VUs / 1 minute
    runs-on: ubuntu-latest
    services:
      mongodb:
        image: mongo:7
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --eval 'db.adminCommand({ ping: 1 })'"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: grafana/setup-k6-action@v1
      - name: Install backend dependencies
        working-directory: backend
        run: npm ci
      - name: Start isolated test backend
        working-directory: backend
        env:
          PORT: 5000
          NODE_ENV: test
          MONGO_URI: mongodb://127.0.0.1:27017/career_navigator_load
          JWT_SECRET: ci-only-not-a-production-secret
        run: |
          node server.js > /tmp/backend.log 2>&1 &
          for i in {1..60}; do
            if curl -fsS http://127.0.0.1:5000/health | grep -q '"database":"connected"'; then exit 0; fi
            sleep 2
          done
          cat /tmp/backend.log
          exit 1
      - name: Run 100-user baseline against isolated Career Navigator API
        env:
          API_BASE_URL: http://127.0.0.1:5000
          HEALTH_PATH: /health
        run: |
          mkdir -p load-tests
          curl --fail-with-body -sS "$API_BASE_URL$HEALTH_PATH" >/dev/null
          k6 run --summary-export=load-tests/summary.json load-tests/k6-baseline.js
      - name: Generate k6 performance report
        if: always()
        run: |
          python -m pip install openpyxl
          python scripts/generate-k6-report.py \
            --summary load-tests/summary.json \
            --output-dir load-tests/report
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: k6-load-test-results
          path: load-tests/
          if-no-files-found: warn

  security:
    name: Backend Discovery, SAST and Dependency Scanning
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install openpyxl requests semgrep
      - name: Discover backend and API route candidates
        run: python security/scripts/discover.py
      - name: Semgrep SAST
        continue-on-error: true
        run: semgrep scan --config auto --json --output "Vulnerability Test Results/semgrep.json" .
      - name: Trivy filesystem and dependency scan
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          format: json
          output: "Vulnerability Test Results/trivy.json"
          exit-code: "0"
          severity: CRITICAL,HIGH,MEDIUM,LOW
      - name: Gitleaks secret scan
        continue-on-error: true
        uses: gitleaks/gitleaks-action@v2
        with:
          args: detect --source . --report-format json --report-path "Vulnerability Test Results/gitleaks.json" --exit-code 0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Dependency Review on pull requests
        if: github.event_name == 'pull_request'
        continue-on-error: true
        uses: actions/dependency-review-action@v4
      - name: Optional safe DAST
        env:
          API_BASE_URL: ${{ vars.API_BASE_URL || 'https://career-navigator-2cwd.onrender.com' }}
          DAST_AUTHORIZED: ${{ vars.DAST_AUTHORIZED }}
        run: python security/scripts/safe-dast.py
      - name: Generate security reports and Excel workbooks
        if: always()
        run: python security/scripts/generate_reports.py
      - name: Fail only for Critical Trivy vulnerabilities
        if: always()
        run: python security/scripts/critical-gate.py
      - name: Publish Actions summary
        if: always()
        run: |
          echo "## Security review" >> "$GITHUB_STEP_SUMMARY"
          cat "Vulnerability Test Results/executive-summary.md" >> "$GITHUB_STEP_SUMMARY" || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: security-review-reports
          path: Vulnerability Test Results/

  master-report:
    name: Consolidated CI Evidence Report
    if: always()
    needs: [selenium, appium, load-test, security]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Download Selenium report
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          name: selenium-execution-report
          path: master-input/selenium
          merge-multiple: false
      - name: Download Appium report
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          name: appium-execution-report
          path: master-input/appium
          merge-multiple: false
      - name: Download k6 report
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          name: k6-load-test-results
          path: master-input/k6
          merge-multiple: false
      - name: Download security report
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          name: security-review-reports
          path: master-input/security
          merge-multiple: false
      - name: Generate master report
        if: always()
        run: |
          python -m pip install openpyxl
          python scripts/generate-master-report.py \
            --input-dir master-input \
            --output-dir master-report
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: career-navigator-master-report
          path: master-report/
          if-no-files-found: error
